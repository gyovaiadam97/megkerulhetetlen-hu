<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ page.title }} · Megkerülhetetlen</title>
<meta name="description" content="{{ page.description }}">
<link rel="canonical" href="{{ site.base_url }}/{{ page.slug }}/">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ page.title }} · Megkerülhetetlen">
<meta property="og:description" content="{{ page.description }}">
<meta property="og:url" content="{{ site.base_url }}/{{ page.slug }}/">
<meta property="og:image" content="{{ site.base_url }}/assets/img/{{ page.og_image or 'og-default.jpg' }}">
<meta property="og:locale" content="hu_HU">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css?v={{ site.build }}">
{% block head %}{% endblock %}
</head>
<body>
{% if page.draft_note %}<div class="draft-banner">{{ page.draft_note }}</div>{% endif %}
{% block body %}{% endblock %}
<footer>
  <div class="wrap">
    <a href="https://www.novastudio.hu" aria-label="Nova"><img src="/assets/img/nova-logo-ink.png" alt="Nova" width="104" height="26"></a>
    <div class="footer-links">
      <a href="/">megkerulhetetlen.hu</a>
      <a href="https://www.novastudio.hu">novastudio.hu</a>
    </div>
    <div>© {{ site.year }} Nova Produkciós Iroda Kft.</div>
  </div>
</footer>
<script>
document.querySelectorAll('.yt[data-id]').forEach(function(el){
  el.addEventListener('click',function(){
    var f=document.createElement('iframe');
    f.src='https://www.youtube-nocookie.com/embed/'+el.dataset.id+'?autoplay=1&rel=0';
    f.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
    f.allowFullscreen=true; f.title=el.getAttribute('aria-label')||'Videó';
    el.innerHTML=''; el.appendChild(f); el.style.cursor='default';
  },{once:true});
});
</script>
{% block scripts %}{% endblock %}
</body>
</html>
