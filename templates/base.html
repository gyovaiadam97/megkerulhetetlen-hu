<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">

<meta name="description" content="{{ page.description }}">
<link rel="canonical" href="{{ site.base_url }}/{{ page.slug }}/">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ page.title }} · Megkerülhetetlen">
<meta property="og:description" content="{{ page.description }}">
<meta property="og:url" content="{{ site.base_url }}/{{ page.slug }}/">
<meta property="og:image" content="{{ site.base_url }}/assets/img/{{ page.og_image or 'og-default.jpg' }}">
<meta property="og:locale" content="hu_HU">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="{{ rel }}assets/img/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="{{ rel }}assets/img/favicon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="{{ rel }}assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Unbounded:wght@500;600;700;800{% if page.font_variant == "inter" %}&family=Inter:wght@400;500;600;700;800{% endif %}&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ rel }}assets/css/style.css?v={{ site.build }}">
{% block head %}{% endblock %}
</head>
<body{% if page.font_variant %} class="font-{{ page.font_variant }}"{% endif %}>
{% if page.draft_note %}<div class="draft-banner">{{ page.draft_note }}</div>{% endif %}
{% block body %}{% endblock %}
<footer>
  <div class="wrap">
    <a href="https://www.novastudio.hu" aria-label="Nova"><img src="{{ rel }}assets/img/nova-logo-ink.png" alt="Nova" width="104" height="26"></a>
    <div class="footer-links">
      <a href="{{ rel }}">megkerulhetetlen.hu</a>
      <a href="https://www.novastudio.hu">novastudio.hu</a>
    </div>
    <div>© {{ site.year }} Nova Produkciós Iroda Kft.</div>
  </div>
</footer>
<script>
/* Videó: asztalon kattintásra iframe + autoplay. Érintőképernyőn az autoplay hangos videónál tiltott,
   ezért ott a YouTube-lejátszót előre betöltjük az indexkép alá, és a koppintás közvetlenül playVideo()-t hív
   → egy koppintás elég. Ha az API nem tölt be, marad a sima iframe (legrosszabb esetben a YouTube saját gombja). */
(function(){
  var els=[].slice.call(document.querySelectorAll('.yt[data-id]')); if(!els.length) return;
  var touch=(window.matchMedia&&matchMedia('(hover: none), (pointer: coarse)').matches)||/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
  function plain(el){
    if(el.querySelector('iframe')) return;
    var f=document.createElement('iframe');
    f.src='https://www.youtube-nocookie.com/embed/'+el.dataset.id+'?autoplay=1&rel=0&playsinline=1';
    f.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
    f.allowFullscreen=true; f.title=el.getAttribute('aria-label')||'Videó';
    el.appendChild(f); el.classList.add('on');
  }
  function arm(el,fn){
    el.addEventListener('click',fn);
    el.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); fn(); } });
  }
  if(!touch){ els.forEach(function(el){ arm(el,function(){ plain(el); }); }); return; }
  var apiFailed=false;
  function build(el){
    if(el._p||!window.YT||!YT.Player) return;
    var slot=document.createElement('div'); el.appendChild(slot);
    try{
      el._p=new YT.Player(slot,{host:'https://www.youtube-nocookie.com',videoId:el.dataset.id,width:'100%',height:'100%',
        playerVars:{playsinline:1,rel:0},
        events:{onReady:function(){ el._ready=true; if(el._want){ try{ el._p.playVideo(); }catch(e){ console.error('[yt] playVideo',e); } } },
                onError:function(e){ console.error('[yt] lejátszó-hiba',el.dataset.id,e&&e.data); }}});
    }catch(e){ console.error('[yt] lejátszó létrehozása nem sikerült',e); apiFailed=true; }
  }
  window.onYouTubeIframeAPIReady=function(){ els.forEach(build); };
  var s=document.createElement('script'); s.src='https://www.youtube.com/iframe_api'; s.async=true;
  s.onerror=function(){ apiFailed=true; console.error('[yt] az iframe API nem töltött be, sima beágyazásra váltok'); };
  document.head.appendChild(s);
  els.forEach(function(el){
    arm(el,function(){
      if(el.classList.contains('on')) return;
      if(el._p){ el._want=true; el.classList.add('on'); if(el._ready){ try{ el._p.playVideo(); }catch(e){ console.error('[yt] playVideo',e); } } }
      else { if(!apiFailed) console.warn('[yt] a lejátszó még nem állt készen, sima beágyazás'); plain(el); }
    });
  });
})();
/* „Megnézem a YouTube-on”: Androidon intent-link, ami közvetlenül az appot nyitja (böngészős tartalékkal);
   iOS-en a sima youtube.com link univerzális linkként az appban nyílik. */
(function(){
  if(!/Android/i.test(navigator.userAgent)) return;
  document.querySelectorAll('a[data-yt-app]').forEach(function(a){
    var u='https://www.youtube.com/watch?v='+a.dataset.ytApp;
    a.href='intent://www.youtube.com/watch?v='+a.dataset.ytApp+'#Intent;package=com.google.android.youtube;scheme=https;S.browser_fallback_url='+encodeURIComponent(u)+';end';
    a.removeAttribute('target');
  });
})();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
